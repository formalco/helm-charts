apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-satellite.fullname" . }}
  labels:
    {{- include "ai-satellite.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-satellite.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-satellite.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: 50055
            - name: health
              containerPort: 8080
          env:
            - name: FORMAL_CONTROL_PLANE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-satellite.fullname" . }}
                  key: formal-api-key
            {{- if kindIs "slice" .Values.env }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- else }}
            {{- range $name, $value := .Values.env }}
            {{- if kindIs "map" $value }}
            - name: {{ $name }}
              {{- toYaml $value | nindent 14 }}
            {{- else if not (kindIs "invalid" $value) }}
            - name: {{ $name }}
              value: {{ $value | toString | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- $readinessProbe := .Values.readinessProbe | default dict }}
          {{- if ne $readinessProbe.enabled false }}
          readinessProbe:
            httpGet:
              path: {{ $readinessProbe.path | default "/ready" }}
              port: {{ $readinessProbe.port | default 8080 }}
            initialDelaySeconds: {{ $readinessProbe.initialDelaySeconds | default 0 }}
            periodSeconds: {{ $readinessProbe.periodSeconds | default 5 }}
            timeoutSeconds: {{ $readinessProbe.timeoutSeconds | default 1 }}
            failureThreshold: {{ $readinessProbe.failureThreshold | default 3 }}
          {{- end }}
        {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if .Values.pullWithCredentials }}
      imagePullSecrets:
        - name: formal-ecr-secret
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
