apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "azure-gar-cred.fullname" . }}-init
  labels:
    {{- include "azure-gar-cred.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  {{- include "azure-gar-cred.job" . | nindent 2 }}
