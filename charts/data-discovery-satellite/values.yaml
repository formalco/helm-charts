nameOverride: ""
fullnameOverride: ""

# API key for the Data Discovery Satellite configured in Formal Control Plane
formalAPIKey: ""

# Set to true when using the ecr-cred or azure-gar-cred Helm chart
# to manage the Formal image pull secret.
pullWithCredentials: false

image:
  repository: 654654333078.dkr.ecr.us-east-1.amazonaws.com/formalco-prod-data-discovery-satellite
  pullPolicy: Always
  tag: "latest"

replicaCount: 2
resources:
  requests:
    cpu: 1
    memory: 2Gi
  limits:
    cpu: 2
    memory: 4Gi

securityContext: {}
podSecurityContext: {}
podAnnotations:
  cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
nodeSelector: {}
affinity: {}
tolerations: []

# Set `create` to false and provide your own service account name if you
# don't want this chart to create one
serviceAccount:
  create: true
  name: ""

# Extra environment variables for the Data Discovery Satellite container,
# keyed by name. A value is either a literal or a Kubernetes env source
# such as valueFrom. A raw list of Kubernetes env entries is also accepted.
#   env:
#     KEY_1: "literal-value"
#     KEY_2:
#       valueFrom:
#         secretKeyRef:
#           name: my-secret
#           key: key2
env: {}

# Load all keys of a Secret or ConfigMap as environment variables.
# Variables set in `env` take precedence.
#   envFrom:
#     - secretRef:
#         name: my-secret
#     - configMapRef:
#         name: my-configmap
envFrom: []

# Extra manifests to deploy as an array of objects
extraManifests: []
  # - apiVersion: v1
  #   kind: ConfigMap
  #   metadata:
  #     name: example-configmap
  #   data:
  #     key: value

# Additional containers to run in the same pod as the main satellite container
sidecars: []
