apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "formal-common.fullname" . }}
  labels:
    {{- include "formal-common.labels" . | nindent 4 }}
data:
  config.yaml: |
    metricsAddr: ":{{ .Values.metricsPort }}"
    {{- with .Values.reconcileInterval }}
    reconcileInterval: {{ . | quote }}
    {{- end }}
    {{- $sources := compact (splitList "," (include "kubernetes-operator.oidcSources" .)) }}
    {{- if gt (len $sources) 0 }}
    oidc:
      integration_id: {{ .Values.oidc.integration_id | quote }}
      {{- range $sources }}
      {{ . }}: {}
      {{- end }}
    {{- end }}
