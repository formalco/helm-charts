nameOverride: ""
fullnameOverride: ""

# API key for the Formal Control Plane. The chart stores it in a Secret.
# Mutually exclusive with formalAPIKeySecret and oidc.
formalAPIKey: ""

# Existing Secret that holds the API key. The chart does not create it.
# Set both name and key. Mutually exclusive with formalAPIKey and oidc.
formalAPIKeySecret:
  name: ""
  key: ""

# OIDC written to the ConfigMap. Mutually exclusive with formalAPIKey and
# formalAPIKeySecret.
# Set integration_id and exactly one source object (aws: {}, azure: {}, or
# serviceAccountToken: {}). serviceAccountToken: {} projects the pod's
# ServiceAccount token with audience oidc.formal.ai/<integration_id>, for
# issuers such as Amazon EKS.
oidc:
  integration_id: ""

serviceAccount:
  annotations: {}

# Set to true when using the ecr-cred or azure-gar-cred Helm chart
# to manage the Formal image pull secret.
pullWithCredentials: false

image:
  repository: 654654333078.dkr.ecr.us-east-1.amazonaws.com/formalco-prod-kubernetes-operator
  pullPolicy: Always
  # Defaults to the chart's appVersion.
  tag: ""

replicaCount: 1
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Written to the operator ConfigMap as metricsAddr. Override at runtime
# with METRICS_ADDR.
metricsPort: 8080

# Written to the operator ConfigMap as reconcileInterval (e.g. "5m", "30s").
# Leave empty to use the operator's default (10m). Override at runtime
# with RECONCILE_INTERVAL.
reconcileInterval: ""

securityContext: {}
podSecurityContext: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
