apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: formal-kubernetes-egress
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: not-already-injected
      expression: >-
        !has(object.spec.initContainers) ||
        !object.spec.initContainers.exists(c, c.name == "formal-kubernetes-egress")
  variables:
    - name: caPath
      expression: "'/formal-ca/localca-cert.pem'"
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            spec: Object.spec{
              {{- if .Values.pullWithCredentials }}
              imagePullSecrets: [
                Object.spec.imagePullSecrets{
                  name: "formal-ecr-secret"
                }
              ],
              {{- end }}
              volumes: [
                Object.spec.volumes{
                  name: "formal-ca",
                  emptyDir: Object.spec.volumes.emptyDir{}
                }
              ],
              containers: object.spec.containers.map(c, Object.spec.containers{
                name: c.name,
                env: [
                  Object.spec.containers.env{
                    name: "SSL_CERT_FILE",
                    value: variables.caPath
                  },
                  Object.spec.containers.env{
                    name: "NIX_SSL_CERT_FILE",
                    value: variables.caPath
                  },
                  Object.spec.containers.env{
                    name: "NODE_EXTRA_CA_CERTS",
                    value: variables.caPath
                  },
                  Object.spec.containers.env{
                    name: "REQUESTS_CA_BUNDLE",
                    value: variables.caPath
                  },
                  Object.spec.containers.env{
                    name: "PIP_CERT",
                    value: variables.caPath
                  },
                  Object.spec.containers.env{
                    name: "AWS_CA_BUNDLE",
                    value: variables.caPath
                  },
                  Object.spec.containers.env{
                    name: "GIT_SSL_CAINFO",
                    value: variables.caPath
                  },
                  Object.spec.containers.env{
                    name: "CARGO_HTTP_CAINFO",
                    value: variables.caPath
                  }
                ],
                volumeMounts: [
                  Object.spec.containers.volumeMounts{
                    name: "formal-ca",
                    mountPath: "/formal-ca",
                    readOnly: true
                  }
                ]
              })
            }
          }
    # JSONPatch value must be one Object, never [Object, ...]. On unpatched
    # apiservers a list of Object literals panics CEL ConvertToNative and the
    # client only sees stream error INTERNAL_ERROR (kubernetes#139032).
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          has(object.spec.initContainers)
            ? [
                JSONPatch{
                  op: "add",
                  path: "/spec/initContainers/-",
                  value: {{ include "kubernetes-egress.celSidecar" . | nindent 18 | trim }}
                }
              ]
            : [
                JSONPatch{op: "add", path: "/spec/initContainers", value: []},
                JSONPatch{
                  op: "add",
                  path: "/spec/initContainers/-",
                  value: {{ include "kubernetes-egress.celSidecar" . | nindent 18 | trim }}
                }
              ]
