{{- define "kubernetes-operator.rbacRules" -}}
- apiGroups: ["joinformal.com"]
  resources:
    - formalresources
    - formalresources/status
    - formallisteners
    - formallisteners/status
    - formalnativeusers
    - formalnativeusers/status
    - formalnativeuserv3s
    - formalnativeuserv3s/status
    - formalnativeuserselections
    - formalnativeuserselections/status
    - formalpolicies
    - formalpolicies/status
    - formalconnectorhostnames
    - formalconnectorhostnames/status
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
{{- end }}
{{- if not .Values.watchNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "formal-common.fullname" . }}
  labels:
    {{- include "formal-common.labels" . | nindent 4 }}
rules:
{{- include "kubernetes-operator.rbacRules" . | nindent 0 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "formal-common.fullname" . }}
  labels:
    {{- include "formal-common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "formal-common.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "formal-common.fullname" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
{{- range .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "formal-common.fullname" $ }}
  namespace: {{ . | quote }}
  labels:
    {{- include "formal-common.labels" $ | nindent 4 }}
rules:
{{- include "kubernetes-operator.rbacRules" $ | nindent 0 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "formal-common.fullname" $ }}
  namespace: {{ . | quote }}
  labels:
    {{- include "formal-common.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "formal-common.fullname" $ }}
subjects:
- kind: ServiceAccount
  name: {{ include "formal-common.fullname" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
