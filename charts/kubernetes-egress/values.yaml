# Native sidecar image. Build from desktop/Dockerfile.linux-endpoint.
sidecar:
  image:
    repository: 654654333078.dkr.ecr.us-east-1.amazonaws.com/formalco-prod-kubernetes-egress
    pullPolicy: Always
    tag: "latest"
  resources:
    requests:
      cpu: 1
      memory: 2Gi
    limits:
      cpu: 2
      memory: 4Gi

# Set true when using the ecr-cred or azure-gar-cred chart.
pullWithCredentials: false

# Secret that holds the API key, in each namespace with labeled Pods. The
# chart does not create it. Set both name and key.
formalAPIKeySecret:
  name: formal-kubernetes-egress
  key: formal-api-key
