suite: OIDC
templates:
  - deployment.yaml
  - configmap.yaml
tests:
  - it: writes the serviceAccountToken path to the file source
    template: configmap.yaml
    set:
      oidc:
        integration_id: integrationoidc_abc
        serviceAccountToken: {}
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: '(?m)^  file:\n    path: "/var/run/secrets/formal/token"$'

  - it: projects a Formal-audience ServiceAccount token with serviceAccountToken
    template: deployment.yaml
    set:
      oidc:
        integration_id: integrationoidc_abc
        serviceAccountToken: {}
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: formal-oidc-token
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    audience: oidc.formal.ai/integrationoidc_abc
                    expirationSeconds: 3600
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: formal-oidc-token
            mountPath: /var/run/secrets/formal
            readOnly: true

  - it: projects no token with the aws source
    template: deployment.yaml
    set:
      oidc:
        integration_id: integrationoidc_abc
        aws: {}
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: formal-oidc-token
          any: true

  - it: requires integration_id with serviceAccountToken
    template: deployment.yaml
    set:
      oidc:
        serviceAccountToken: {}
    asserts:
      - failedTemplate:
          errorMessage: oidc.integration_id is required with an oidc source

  - it: rejects serviceAccountToken with aws
    template: deployment.yaml
    set:
      oidc:
        integration_id: integrationoidc_abc
        aws: {}
        serviceAccountToken: {}
    asserts:
      - failedTemplate:
          errorMessage: oidc sources are mutually exclusive
