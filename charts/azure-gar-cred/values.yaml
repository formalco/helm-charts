nameOverride: ""
fullnameOverride: ""

azure:
  # Client ID of the customer user-assigned managed identity used by Azure Workload Identity.
  # This is not the managed identity object ID used by the GCP WIF attribute condition.
  clientId: ""
  # Microsoft Entra tenant ID.
  tenantId: ""
  # Microsoft Entra resource audience requested before exchanging the token with GCP.
  audience: "https://management.azure.com"

gcp:
  # Formal-managed GCP WIF and GAR configuration.
  projectNumber: "155668543206"
  poolId: "azure-customers"
  providerId: ""
  serviceAccountEmail: ""
  registryHost: "us-docker.pkg.dev"

schedule: "*/30 * * * *"
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 1
# Fail a stuck Job so concurrencyPolicy: Forbid cannot skip later refreshes.
activeDeadlineSeconds: 600

image:
  # Includes curl, jq, and kubectl; no runtime downloads are required.
  repository: alpine/k8s
  tag: "1.34.9"
  pullPolicy: IfNotPresent
  digest: ""

podLabels: {}
nodeSelector: {}
affinity: {}
tolerations: []
