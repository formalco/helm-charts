{{- include "kubernetes-operator.validateAuth" . }}
{{- $oidcSources := compact (splitList "," (include "kubernetes-operator.oidcSources" .)) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "formal-common.fullname" . }}
  labels:
    {{- include "formal-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "formal-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "formal-common.selectorLabels" . | nindent 8 }}
        {{- if has "azure" $oidcSources }}
        azure.workload.identity/use: "true"
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      serviceAccountName: {{ include "formal-common.fullname" . }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
          env:
            - name: FORMAL_CONFIG
              value: /etc/formal/config.yaml
            {{- if include "formal-common.hasAPIKey" . }}
            - name: FORMAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "formal-common.apiKeySecretName" . | quote }}
                  key: {{ include "formal-common.apiKeySecretKey" . | quote }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/formal
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "formal-common.fullname" . }}
      {{- if .Values.pullWithCredentials }}
      imagePullSecrets:
        - name: formal-ecr-secret
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
