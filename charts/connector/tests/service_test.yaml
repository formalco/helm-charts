suite: Service
templates:
  - service.yaml
tests:
  - it: sets loadBalancerIP
    set:
      service.loadBalancerIP: 203.0.113.10
    asserts:
      - equal:
          path: spec.loadBalancerIP
          value: 203.0.113.10

  - it: sets an IPv6 loadBalancerIP
    set:
      service.loadBalancerIP: "2001:db8::"
    asserts:
      - equal:
          path: spec.loadBalancerIP
          value: "2001:db8::"

  - it: omits loadBalancerIP by default
    asserts:
      - notExists:
          path: spec.loadBalancerIP
